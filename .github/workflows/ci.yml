name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
        run: |
          pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: IAM SQL + least-privilege role against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest tests/integration -q -rs

  prod-contract:
    # This API, as api_service, against TheEyeBetaProd's schema at
    # contracts/prod/PROD_SHA (generated snapshot) with Prod's api_readonly
    # grants, the iam SQL and db_security.sql. Fails on missing tables,
    # renamed columns, incompatible types, invalid SQL or broken serialization.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: HTTP API against Prod schema
        env:
          PROD_CONTRACT: "1"
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql+psycopg://api_service:ci-contract-only-password@localhost:5432/dataapi_contract
          SERVICE_CLIENT_AUTH_MODE: database
          POLICY_ENFORCEMENT_ENABLED: "true"
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
        run: pytest tests/contract -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff
        run: ruff check app tests scripts

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "$(grep '^pip-audit==' requirements-dev.txt)"

      - name: Audit runtime dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # theeyebeta-dataapi is a --user unit, so every systemctl/journalctl call in
      # this job needs --user + a reachable user D-Bus session. The self-hosted
      # runner is a system-level service (see scripts/install_service.sh's
      # comment on why the *app* unit isn't), so its job steps don't inherit
      # this automatically even though linger is enabled for this user.
      XDG_RUNTIME_DIR: /run/user/1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy repo
        id: deploy-repo
        run: |
          # theeyebeta-dataapi is a --user systemd unit, not a system one; a plain
          # `systemctl show` (no --user) silently returns empty against it.
          repo_dir="$(systemctl --user show -p WorkingDirectory --value theeyebeta-dataapi 2>/dev/null || true)"

          if [ -z "$repo_dir" ] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
            candidate="$(cd "$GITHUB_WORKSPACE/../../../.." && pwd)"
            if [ -f "$candidate/scripts/deploy.sh" ] && [ -x "$candidate/.venv/bin/pip" ]; then
              repo_dir="$candidate"
            fi
          fi

          if [ -z "$repo_dir" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -x "$GITHUB_WORKSPACE/.venv/bin/pip" ]; then
            repo_dir="$GITHUB_WORKSPACE"
          fi

          if [ -z "$repo_dir" ] || [ ! -f "$repo_dir/scripts/deploy.sh" ]; then
            echo "Could not resolve the production repo directory." >&2
            exit 1
          fi

          echo "repo_dir=$repo_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        env:
          DEPLOY_REPO_DIR: ${{ steps.deploy-repo.outputs.repo_dir }}
        run: bash scripts/deploy.sh
