name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
        run: |
          pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: IAM SQL + least-privilege role against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest tests/integration -q -rs

  prod-contract:
    # This API, as api_service, against TheEyeBetaProd's schema at
    # contracts/prod/PROD_SHA (generated snapshot) with Prod's api_readonly
    # grants, the iam SQL and db_security.sql. Fails on missing tables,
    # renamed columns, incompatible types, invalid SQL or broken serialization.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: HTTP API against Prod schema
        env:
          PROD_CONTRACT: "1"
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql+psycopg://api_service:ci-contract-only-password@localhost:5432/dataapi_contract
          SERVICE_CLIENT_AUTH_MODE: database
          POLICY_ENFORCEMENT_ENABLED: "true"
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
        run: pytest tests/contract -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Prometheus rules and config (promtool)
        run: |
          v=3.5.0
          curl -sSLf -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz"
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  prom.tgz" | sha256sum -c -
          tar xzf prom.tgz "prometheus-${v}.linux-amd64/promtool"
          "./prometheus-${v}.linux-amd64/promtool" check rules deploy/prometheus/rules/*.yml
          "./prometheus-${v}.linux-amd64/promtool" check config --syntax-only deploy/prometheus.yml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: mypy (app/)
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-bytes-long"
        run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "$(grep '^pip-audit==' requirements-dev.txt)"

      - name: Audit runtime and dev dependencies for known vulnerabilities
        run: pip-audit -r requirements-dev.txt

  secrets:
    # Full history, default gitleaks rules + .gitleaks.toml placeholder allowlist.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          v=8.30.0
          curl -sSLf -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
          ./gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  deploy:
    # Every check must pass first; nothing here is optional.
    needs: [test, integration, prod-contract, lint, typecheck, audit, secrets]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # theeyebeta-dataapi is a --user unit, so every systemctl/journalctl call in
      # this job needs --user + a reachable user D-Bus session. The self-hosted
      # runner is a system-level service (see scripts/install_service.sh's
      # comment on why the *app* unit isn't), so its job steps don't inherit
      # this automatically even though linger is enabled for this user.
      XDG_RUNTIME_DIR: /run/user/1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy repo
        id: deploy-repo
        run: |
          # theeyebeta-dataapi is a --user systemd unit, not a system one; a plain
          # `systemctl show` (no --user) silently returns empty against it.
          repo_dir="$(systemctl --user show -p WorkingDirectory --value theeyebeta-dataapi 2>/dev/null || true)"

          if [ -z "$repo_dir" ] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
            candidate="$(cd "$GITHUB_WORKSPACE/../../../.." && pwd)"
            if [ -f "$candidate/scripts/deploy.sh" ] && [ -x "$candidate/.venv/bin/pip" ]; then
              repo_dir="$candidate"
            fi
          fi

          if [ -z "$repo_dir" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -x "$GITHUB_WORKSPACE/.venv/bin/pip" ]; then
            repo_dir="$GITHUB_WORKSPACE"
          fi

          if [ -z "$repo_dir" ] || [ ! -f "$repo_dir/scripts/deploy.sh" ]; then
            echo "Could not resolve the production repo directory." >&2
            exit 1
          fi

          echo "repo_dir=$repo_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        env:
          DEPLOY_REPO_DIR: ${{ steps.deploy-repo.outputs.repo_dir }}
          # The exact commit the jobs above tested; deploy.sh refuses it unless it is on origin/main.
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy.sh

      - name: Admin E2E smoke (no secrets)
        # deploy.sh already required /health database=true (and rolled back if not).
        # A failure here leaves the deploy in place and fails the run for an operator.
        env:
          DEPLOY_REPO_DIR: ${{ steps.deploy-repo.outputs.repo_dir }}
        run: '"$DEPLOY_REPO_DIR/.venv/bin/python" "$DEPLOY_REPO_DIR/scripts/e2e_admin_smoke.py" http://127.0.0.1:7000'

