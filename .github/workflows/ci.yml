name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          API_KEY: "this-is-a-dummy-api-key-with-24chars"
          JWT_SECRET: "this-is-a-dummy-jwt-secret-24c"
        run: |
          pytest

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy repo
        id: deploy-repo
        run: |
          repo_dir="$(systemctl show -p WorkingDirectory --value theeyebeta-dataapi 2>/dev/null || true)"

          if [ -z "$repo_dir" ] && [ -n "${RUNNER_WORKSPACE:-}" ]; then
            repo_dir="$(cd "$RUNNER_WORKSPACE/../.." && pwd)"
          fi

          if [ -z "$repo_dir" ] || [ ! -f "$repo_dir/scripts/deploy.sh" ]; then
            echo "Could not resolve the production repo directory." >&2
            exit 1
          fi

          echo "repo_dir=$repo_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        env:
          DEPLOY_REPO_DIR: ${{ steps.deploy-repo.outputs.repo_dir }}
        run: bash scripts/deploy.sh
