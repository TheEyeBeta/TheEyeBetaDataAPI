server {
    listen 80;
    # Cloudflare Tunnel will terminate TLS at the edge and forward HTTP traffic
    # for this hostname to port 80 on this server.
    server_name api.theeyebeta.store dataapi.theeyebeta.store;

    client_max_body_size 2m;

    location / {
        proxy_pass http://dataapi:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
