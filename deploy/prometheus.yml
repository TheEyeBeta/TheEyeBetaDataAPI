global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: theeyebeta-dataapi

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: dataapi
    # Scrapes /metrics from the DataAPI process. In native deploy, point this
    # at 127.0.0.1:7000; the docker-compose service name remains `dataapi`.
    static_configs:
      - targets:
          - dataapi:7000
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
