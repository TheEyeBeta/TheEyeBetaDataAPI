global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: theeyebeta-dataapi

scrape_configs:
  - job_name: dataapi
    # Scrapes /metrics directly from the app container on the internal Docker
    # network — never touches nginx, never reachable from the internet.
    static_configs:
      - targets:
          - dataapi:7000
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
