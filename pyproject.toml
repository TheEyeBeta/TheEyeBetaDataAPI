[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["packages"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, bandit (security)
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines: no whole-codebase reformat in one sweep (docs/TECH_DEBT.md)
    "B008",  # FastAPI Depends()/Query() in argument defaults is the framework idiom
    "UP042", # str+Enum -> StrEnum changes str() output; a behavior change, not a lint fix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S608"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["actions-runner", ".venv", ".git", "packages"]
