services:
  dataapi:
    build: .
    container_name: theeyebeta-dataapi
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 7000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7000:7000"
    expose:
      - "7000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: theeyebeta-dataapi-nginx
    depends_on:
      dataapi:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
